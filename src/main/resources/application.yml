spring:
  application:
    name: simpoint-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/simpoint}
    username: ${DB_USER:simpoint}
    password: ${DB_PASSWORD:simpoint}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  data:
    web:
      pageable:
        serialization-mode: via_dto

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # Значения по умолчанию нет намеренно: секрет задаётся только через окружение.
    secret: ${JWT_SECRET:}
    ttl-minutes: ${JWT_TTL_MINUTES:480}
  timezone: ${APP_TIMEZONE:Europe/Moscow}
  bootstrap:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:}
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    token: ${TELEGRAM_BOT_TOKEN:}
    poll-timeout-seconds: 25

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
